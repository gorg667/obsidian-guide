    - 11-templates-and-templater.md
    - 12-dataview.md
    - 13-tasks-and-time.md
    - 14-essential-community-plugins.md
  - "Part IV — Obsidian for Everything in Life":
    - 15-daily-notes-and-journaling.md
    - 16-tasks-projects-goals.md
    - 17-knowledge-learning.md
    - 18-academic-research.md
    - 19-work-and-career.md
    - 20-health-fitness-food.md
    - 21-finance.md
    - 22-home-life-admin.md
    - 23-relationships-and-people.md
    - 24-creativity-writing-media.md
    - 25-mind-and-self.md
  - "Part V — Power User":
